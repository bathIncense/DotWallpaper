[package]
name = "dotwallpaper"
version = "0.1.2"
description = "DotWallpaper 壁纸工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 仅启用必需功能：asset 协议 + 菜单栏托盘
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 仅保留主线程结果通道需要的最小特性
tokio = { version = "1", features = ["sync"] }

# macOS AppKit / Foundation / CoreGraphics / AVFoundation
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "AVPlayerLooper",
    "AVAsset",
    "AVAssetImageGenerator",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-quartz-core = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGWindowLevel"] }
objc2-core-media = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# strip=false：Apple 新版 strip 路径会产出 mis-aligned LINKEDIT 的 dylib，
# 破坏编译期 proc-macro dlopen（rust-lang/rust#157750）；发布后单独对主二进制 strip
strip = false
incremental = false
