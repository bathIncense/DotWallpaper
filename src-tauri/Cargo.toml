[package]
name = "dotwallpaper"
version = "0.1.2"
description = "DotWallpaper 壁纸工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
zerofrom = "0.1.6"

# 缩略图生成（解码 jpg/png/bmp/webp，编码 webp/jpeg）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }

# macOS AppKit / Foundation / AVFoundation（NSWorkspace 设壁、桌面播放层、屏幕枚举）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = [
    "AVPlayer",
    "AVPlayerItem",
    "AVPlayerLayer",
    "AVPlayerLooper",
    "AVAsset",
    "AVAssetImageGenerator",
] }
objc2-quartz-core = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGWindowLevel"] }
objc2-image-io = { version = "0.3", features = ["CGImageMetadata"] }
objc2-core-media = "0.3"

# Windows Win32 API（设置桌面壁纸使用 SystemParametersInfoW）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
] }

[profile.release]
panic = "abort"
codegen-units = 4
lto = false
opt-level = "s"
strip = false
